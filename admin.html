<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – BarberElite</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .admin-panel { display: block; }

    .admin-topbar {
      background: var(--dark2);
      border-bottom: 2px solid var(--gold);
      padding: 0 40px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-topbar-logo { font-size: 1.2rem; font-weight: 700; color: var(--white); }
    .admin-topbar-logo span { color: var(--gold); }

    .admin-badge {
      background: rgba(201,168,76,0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .admin-body {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 65px);
    }

    .admin-sidebar {
      background: var(--dark2);
      border-right: 1px solid #2a2a2a;
      padding: 25px 0;
    }

    .sidebar-menu { list-style: none; }

    .sidebar-menu li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 25px;
      color: var(--text-muted);
      font-size: 0.92rem;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      cursor: pointer;
    }

    .sidebar-menu li a:hover,
    .sidebar-menu li a.active {
      color: var(--gold);
      background: rgba(201,168,76,0.07);
      border-left-color: var(--gold);
    }

    .sidebar-menu li a .icon { font-size: 1.1rem; width: 22px; text-align: center; }

    .admin-main { padding: 35px 40px; overflow-y: auto; }

    .admin-page { display: none; }
    .admin-page.active { display: block; }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: var(--dark2);
      border: 1px solid #2a2a2a;
      border-radius: var(--radius);
      padding: 25px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
    }

    .stat-card .sc-icon { font-size: 2rem; margin-bottom: 10px; }
    .stat-card .sc-num  { font-size: 2.2rem; font-weight: 800; color: var(--gold); }
    .stat-card .sc-label { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    .admin-table-wrap {
      background: var(--dark2);
      border: 1px solid #2a2a2a;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .admin-table-header {
      padding: 18px 25px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-table-header h3 { color: var(--white); font-size: 1rem; }

    .search-box {
      background: var(--dark3);
      border: 1px solid #333;
      border-radius: var(--radius);
      padding: 7px 14px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 200px;
      transition: border-color 0.3s;
    }

    .search-box:focus { border-color: var(--gold); }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: rgba(201,168,76,0.07); }
    thead th {
      padding: 12px 20px;
      text-align: left;
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    tbody tr { border-top: 1px solid #1e1e1e; transition: background 0.2s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody td { padding: 13px 20px; color: var(--text); font-size: 0.88rem; vertical-align: middle; }
    .td-muted { color: var(--text-muted); }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
    .badge-new   { background: rgba(92,184,92,0.15);   color: #5cb85c; border: 1px solid #5cb85c; }
    .badge-citit { background: rgba(153,153,153,0.1);  color: #999;    border: 1px solid #555; }
    .badge-user  { background: rgba(100,149,237,0.1);  color: cornflowerblue; border: 1px solid cornflowerblue; }

    .btn-icon {
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-icon:hover { border-color: var(--danger); color: var(--danger); }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .empty-state .e-icon { font-size: 3rem; margin-bottom: 12px; }

    .settings-card {
      background: var(--dark2);
      border: 1px solid #2a2a2a;
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 20px;
      max-width: 500px;
    }

    .settings-card h3 { color: var(--white); margin-bottom: 20px; font-size: 1rem; }

    #admin-hamburger { display: none; }

    @media (max-width: 768px) {
      .admin-body { grid-template-columns: 1fr; }
      .admin-sidebar {
        display: none;
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 260px;
        z-index: 500;
        padding-top: 70px;
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }
      .admin-sidebar.open { display: block; }
      .admin-main { padding: 20px 15px; }
      .admin-topbar { padding: 0 16px; }
      #admin-hamburger { display: flex !important; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; background: transparent; border: none; }
      #admin-hamburger span { display: block; width: 26px; height: 3px; background: var(--gold); border-radius: 3px; }
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
      .admin-table-wrap { overflow-x: auto; }
      table { min-width: 500px; }
      .settings-card { max-width: 100%; }
    }

    @media (max-width: 400px) {
      .stat-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="admin-panel" id="admin-panel">

  <div class="admin-topbar">
    <div class="admin-topbar-logo">Barber<span>Elite</span> &nbsp;<span class="admin-badge">ADMIN</span></div>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="index.html" class="btn btn-outline" style="padding:7px 16px; font-size:0.82rem;">← Site</a>
      <button id="admin-hamburger" onclick="toggleAdminSidebar()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="admin-body">
    <aside class="admin-sidebar" id="admin-sidebar">
      <ul class="sidebar-menu">
        <li><a class="active" onclick="showPage('dashboard', this)"><span class="icon">📊</span> Dashboard</a></li>
        <li><a onclick="showPage('mesaje', this)"><span class="icon">✉</span> Mesaje <span id="mesaje-badge" style="margin-left:auto; background:var(--danger); color:white; padding:2px 7px; border-radius:50px; font-size:0.75rem;"></span></a></li>
        <li><a onclick="showPage('utilizatori', this)"><span class="icon">👥</span> Utilizatori</a></li>
        <li style="margin-top:20px;">
          <a href="index.html"><span class="icon">🌐</span> Vezi site-ul</a>
        </li>
      </ul>
    </aside>

    <main class="admin-main">

      <!-- DASHBOARD -->
      <div class="admin-page active" id="page-dashboard">
        <h2 style="color:var(--white); margin-bottom:25px;">Bun venit în panou 👋</h2>
        <div class="stat-cards" id="stat-cards"></div>
        <div class="admin-table-wrap">
          <div class="admin-table-header">
            <h3>📨 Ultimele mesaje</h3>
            <a onclick="showPage('mesaje', null)" style="font-size:0.85rem; cursor:pointer;">Vezi toate →</a>
          </div>
          <div id="dash-mesaje-table"></div>
        </div>
      </div>

      <!-- MESAJE -->
      <div class="admin-page" id="page-mesaje">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; flex-wrap:wrap; gap:10px;">
          <h2 style="color:var(--white);">✉ Mesaje primite</h2>
          <button class="btn btn-danger" style="font-size:0.82rem; padding:8px 16px;" onclick="stergeToateMesajele()">🗑 Șterge toate</button>
        </div>
        <div class="admin-table-wrap">
          <div class="admin-table-header">
            <h3>Toate mesajele <span id="msg-count" style="color:var(--text-muted); font-size:0.8rem; font-weight:400;"></span></h3>
            <input class="search-box" type="text" placeholder="🔍 Caută..." oninput="cautaMesaje(this.value)" />
          </div>
          <div id="mesaje-table"></div>
        </div>
      </div>

      <!-- UTILIZATORI -->
      <div class="admin-page" id="page-utilizatori">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; flex-wrap:wrap; gap:10px;">
          <h2 style="color:var(--white);">👥 Utilizatori înregistrați</h2>
          <button class="btn btn-danger" style="font-size:0.82rem; padding:8px 16px;" onclick="stergeToatiUtilizatorii()">🗑 Șterge toți</button>
        </div>
        <div class="admin-table-wrap">
          <div class="admin-table-header">
            <h3>Conturi create</h3>
            <input class="search-box" type="text" placeholder="🔍 Caută..." oninput="cautaUtilizatori(this.value)" />
          </div>
          <div id="utilizatori-table"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwHvp9_-sCInstS5IwG2MB91Jnrw151rs",
  authDomain: "barberelite-508f3.firebaseapp.com",
  projectId: "barberelite-508f3",
  storageBucket: "barberelite-508f3.firebasestorage.app",
  messagingSenderId: "462591045276",
  appId: "1:462591045276:web:f2e4379cca83aa95210759"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const USERS_KEY = 'frizerie_users';
let mesajeCache = [];

// ===== FIRESTORE MESAJE =====
function startListen() {
  const q = query(collection(db, 'mesaje'), orderBy('data', 'desc'));
  onSnapshot(q, snap => {
    mesajeCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateBadge();
    if (document.getElementById('page-mesaje').classList.contains('active')) renderMesaje();
    if (document.getElementById('page-dashboard').classList.contains('active')) loadDashboard();
  });
}

function formatData(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ro-RO', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ===== NAVIGARE =====
function showPage(id, el) {
  document.querySelectorAll('.admin-page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (el) {
    document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
  }
  if (id === 'mesaje')      renderMesaje();
  if (id === 'utilizatori') renderUtilizatori();
  if (id === 'dashboard')   loadDashboard();
  if (window.innerWidth <= 768) closeSidebar();
}

// ===== DASHBOARD =====
function loadDashboard() {
  const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
  const noi = mesajeCache.filter(m => !m.citit).length;
  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card"><div class="sc-icon">👥</div><div class="sc-num">${users.length}</div><div class="sc-label">Utilizatori</div></div>
    <div class="stat-card"><div class="sc-icon">✉</div><div class="sc-num">${mesajeCache.length}</div><div class="sc-label">Mesaje totale</div></div>
    <div class="stat-card"><div class="sc-icon">🔔</div><div class="sc-num">${noi}</div><div class="sc-label">Necitite</div></div>
    <div class="stat-card"><div class="sc-icon">📅</div><div class="sc-num">${new Date().toLocaleDateString('ro-RO')}</div><div class="sc-label">Azi</div></div>
  `;
  renderMesajeTable(mesajeCache.slice(0, 5), 'dash-mesaje-table');
}

function updateBadge() {
  const noi = mesajeCache.filter(m => !m.citit).length;
  const b = document.getElementById('mesaje-badge');
  if (b) b.textContent = noi > 0 ? noi : '';
}

// ===== TABEL MESAJE =====
function renderMesajeTable(msgs, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!msgs.length) {
    el.innerHTML = `<div class="empty-state"><div class="e-icon">📭</div><p>Niciun mesaj primit.</p></div>`;
    return;
  }
  el.innerHTML = `<table><thead><tr>
    <th>#</th><th>Nume</th><th>Email</th><th>Subiect</th><th>Data</th><th>Status</th><th>Acțiuni</th>
  </tr></thead><tbody>
    ${msgs.map((m, i) => `
      <tr style="cursor:pointer;" onclick="toggleRand('r-${containerId}-${i}','${m.id}')">
        <td class="td-muted">${i+1}</td>
        <td><strong>${m.nume||'—'}</strong></td>
        <td class="td-muted">${m.email||'—'}</td>
        <td>${m.subiect||'—'}</td>
        <td class="td-muted">${formatData(m.data)}</td>
        <td><span class="badge ${m.citit?'badge-citit':'badge-new'}">${m.citit?'Citit':'Nou'}</span></td>
        <td onclick="event.stopPropagation()" style="display:flex;gap:6px;">
          <button class="btn-icon" onclick="toggleRand('r-${containerId}-${i}','${m.id}')" title="Vezi">👁</button>
          <button class="btn-icon" onclick="citesteMsg('${m.id}')" title="Citit">✔</button>
          <button class="btn-icon" onclick="stergeMsg('${m.id}')" title="Șterge">🗑</button>
        </td>
      </tr>
      <tr id="r-${containerId}-${i}" style="display:none;background:rgba(201,168,76,0.04);">
        <td colspan="7" style="padding:0 20px 15px;">
          <div style="background:var(--dark3);border:1px solid #2a2a2a;border-radius:8px;padding:15px 18px;font-size:0.87rem;color:var(--text);line-height:1.8;">
            <div>📞 <span style="color:var(--text-muted)">Telefon:</span> <strong>${m.telefon||'—'}</strong></div>
            <div>📧 <span style="color:var(--text-muted)">Email:</span> <strong>${m.email||'—'}</strong></div>
            <div>🗂 <span style="color:var(--text-muted)">Subiect:</span> <strong>${m.subiect||'—'}</strong></div>
            <div style="border-top:1px solid #2a2a2a;margin-top:10px;padding-top:10px;">
              💬 <span style="color:var(--text-muted)">Mesaj:</span><br/>
              <span style="color:var(--white);display:block;margin-top:5px;white-space:pre-wrap;">${m.mesaj||'—'}</span>
            </div>
          </div>
        </td>
      </tr>
    `).join('')}
  </tbody></table>`;
}

function renderMesaje(filtru = '') {
  let msgs = mesajeCache;
  const countEl = document.getElementById('msg-count');
  if (countEl) countEl.textContent = `(${msgs.length})`;
  if (filtru) msgs = msgs.filter(m =>
    (m.nume||'').toLowerCase().includes(filtru) ||
    (m.email||'').toLowerCase().includes(filtru) ||
    (m.mesaj||'').toLowerCase().includes(filtru)
  );
  renderMesajeTable(msgs, 'mesaje-table');
}

function toggleRand(rowId, msgId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  const open = row.style.display === 'table-row';
  row.style.display = open ? 'none' : 'table-row';
  if (!open) citesteMsg(msgId);
}

async function citesteMsg(id) {
  try { await updateDoc(doc(db, 'mesaje', id), { citit: true }); } catch(e){}
}

async function stergeMsg(id) {
  if (!confirm('Ștergi acest mesaj?')) return;
  try { await deleteDoc(doc(db, 'mesaje', id)); } catch(e){}
}

async function stergeToateMesajele() {
  if (!confirm('Ștergi TOATE mesajele?')) return;
  const snap = await getDocs(collection(db, 'mesaje'));
  for (const d of snap.docs) await deleteDoc(doc(db, 'mesaje', d.id));
}

function cautaMesaje(val) { renderMesaje(val.toLowerCase()); }

// ===== UTILIZATORI =====
function renderUtilizatori(filtru = '') {
  let users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
  if (filtru) users = users.filter(u =>
    u.nume.toLowerCase().includes(filtru) || u.email.toLowerCase().includes(filtru)
  );
  const el = document.getElementById('utilizatori-table');
  if (!users.length) {
    el.innerHTML = `<div class="empty-state"><div class="e-icon">👤</div><p>Niciun utilizator înregistrat.</p></div>`;
    return;
  }
  el.innerHTML = `<table><thead><tr>
    <th>#</th><th>Nume</th><th>Email</th><th>Telefon</th><th>Rol</th><th>Acțiuni</th>
  </tr></thead><tbody>
    ${users.map((u, i) => `
      <tr>
        <td class="td-muted">${i+1}</td>
        <td><strong>${u.nume}</strong></td>
        <td class="td-muted">${u.email}</td>
        <td class="td-muted">${u.telefon}</td>
        <td><span class="badge badge-user">Client</span></td>
        <td><button class="btn-icon" onclick="stergeUser(${u.id})">🗑</button></td>
      </tr>
    `).join('')}
  </tbody></table>`;
}

function cautaUtilizatori(val) { renderUtilizatori(val.toLowerCase()); }

function stergeUser(id) {
  if (!confirm('Ștergi acest cont?')) return;
  const users = JSON.parse(localStorage.getItem(USERS_KEY)||'[]').filter(u => u.id !== id);
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
  renderUtilizatori();
  loadDashboard();
}

function stergeToatiUtilizatorii() {
  if (!confirm('Ștergi TOATE conturile?')) return;
  localStorage.setItem(USERS_KEY, '[]');
  renderUtilizatori();
  loadDashboard();
}

// ===== SIDEBAR MOBIL =====
function toggleAdminSidebar() {
  const s = document.getElementById('admin-sidebar');
  s.classList.toggle('open');
  let ov = document.getElementById('sidebar-ov');
  if (s.classList.contains('open')) {
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'sidebar-ov';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:499;';
      ov.onclick = closeSidebar;
      document.body.appendChild(ov);
    }
  } else { closeSidebar(); }
}

function closeSidebar() {
  document.getElementById('admin-sidebar').classList.remove('open');
  const ov = document.getElementById('sidebar-ov');
  if (ov) ov.remove();
}

// Expune global pentru onclick
window.showPage = showPage;
window.toggleRand = toggleRand;
window.citesteMsg = citesteMsg;
window.stergeMsg = stergeMsg;
window.stergeToateMesajele = stergeToateMesajele;
window.cautaMesaje = cautaMesaje;
window.renderMesaje = renderMesaje;
window.stergeUser = stergeUser;
window.stergeToatiUtilizatorii = stergeToatiUtilizatorii;
window.cautaUtilizatori = cautaUtilizatori;
window.toggleAdminSidebar = toggleAdminSidebar;
window.updateBadge = updateBadge;

// START
startListen();
loadDashboard();
</script>
</body>
</html>
