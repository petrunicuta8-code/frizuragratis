<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conectare – NADO dnzz</title>
  <meta name="description" content="Conectează-te la contul tău NADO dnzz pentru a gestiona programările."/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#d32f2f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="NADO dnzz"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <style>
    /* ===== CONTURI SALVATE ===== */
    .saved-accounts {
      margin-bottom: 18px;
    }

    .saved-accounts-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .saved-account-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--dark3);
      border: 1.5px solid #2a2a2a;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.25s;
      margin-bottom: 8px;
      position: relative;
    }

    .saved-account-item:hover {
      border-color: var(--gold);
      background: rgba(201,168,76,0.07);
    }

    .saved-account-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--dark);
      flex-shrink: 0;
    }

    .saved-account-info { flex: 1; min-width: 0; }

    .saved-account-name {
      color: var(--white);
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-account-email {
      color: var(--text-muted);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-account-arrow {
      color: var(--gold);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .saved-account-remove {
      position: absolute;
      top: 6px; right: 6px;
      background: transparent;
      border: none;
      color: #555;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.2s;
      display: none;
    }

    .saved-account-item:hover .saved-account-remove { display: block; }
    .saved-account-remove:hover { color: var(--danger); }

    .form-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .form-divider::before,
    .form-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }
  </style>
</head>
<body class="page-enter">

<!-- BULE ANIMATE -->
<div class="bubbles-container">
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="scissors-particle">✂</div><div class="scissors-particle">✂</div>
  <div class="scissors-particle">✂</div><div class="scissors-particle">✂</div>
  <div class="scissors-particle">✂</div>
</div>

<!-- NAVBAR -->
<nav>
  <div class="nav-logo">
    <span class="scissors">✂</span>
    <span>NADO <em>dnzz</em></span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Acasă</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-auth" id="nav-auth">
    <a href="login.html" class="btn btn-outline">Conectare</a>
    <a href="register.html" class="btn btn-gold">Înregistrare</a>
  </div>
  <button class="hamburger" onclick="openMobileMenu()"><span></span><span></span><span></span></button>
</nav>

<!-- FORMULAR LOGIN -->
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-icon">🔐</div>
      <h2>Conectare</h2>
      <p>Bun venit înapoi la NADO dnzz</p>
    </div>

    <div class="alert alert-error"   id="alert-error"></div>
    <div class="alert alert-success" id="alert-success"></div>

    <!-- FORMULAR -->
    <form id="login-form">
      <div class="form-group">
        <label for="email">Adresă email</label>
        <input type="email" id="email" placeholder="email@exemplu.ro" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="parola">Parolă</label>
        <input type="password" id="parola" placeholder="Parola ta" required autocomplete="current-password" />
      </div>

      <div style="text-align:right; margin-bottom:18px;">
        <a href="forgot-password.html" style="font-size:0.88rem; color:var(--text-muted);">
          Am uitat parola
        </a>
      </div>

      <button type="submit" class="btn btn-gold btn-full">Conectare</button>
    </form>

    <div class="form-footer">
      Nu ai cont? <a href="register.html">Înregistrează-te</a>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module">
  import { login, waitForAuth } from './js/auth.js';

  // Dacă e deja logat, trimite direct la cont
  waitForAuth().then(session => {
    if (session) window.location.href = 'cont.html';
  });

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email  = document.getElementById('email').value.trim();
    const parola = document.getElementById('parola').value;
    const errEl  = document.getElementById('alert-error');
    const sucEl  = document.getElementById('alert-success');
    const btn    = this.querySelector('button[type="submit"]');
    errEl.classList.remove('show');
    sucEl.classList.remove('show');

    btn.textContent = 'Se verifică...';
    btn.disabled = true;

    const result = await login(email, parola);
    if (!result.success) {
      errEl.textContent = result.message;
      errEl.classList.add('show');
      btn.textContent = 'Conectare';
      btn.disabled = false;
    } else {
      sucEl.textContent = 'Conectare reușită! Te redirecționez...';
      sucEl.classList.add('show');
      setTimeout(() => window.location.href = 'cont.html', 1000);
    }
  });
</script>
</body>
</html>
