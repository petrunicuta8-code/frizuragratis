<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperare Parolă – BarberElite</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-logo">
    <span class="scissors">✂</span>
    <span>Barber<em>Elite</em></span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Acasă</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-auth" id="nav-auth">
    <a href="login.html" class="btn btn-outline">Conectare</a>
    <a href="register.html" class="btn btn-gold">Înregistrare</a>
  </div>
  <button class="hamburger" onclick="openMobileMenu()"><span></span><span></span><span></span></button>
</nav>

<!-- RECUPERARE PAROLĂ -->
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-icon">🔑</div>
      <h2>Recuperare parolă</h2>
      <p>Introdu emailul și telefonul cu care te-ai înregistrat</p>
    </div>

    <div class="alert alert-error"   id="alert-error"></div>

    <!-- PASUL 1: Formular verificare -->
    <div id="step-1">
      <form id="recover-form">
        <div class="form-group">
          <label for="email">Adresă email</label>
          <input type="email" id="email" placeholder="email@exemplu.ro" required />
        </div>
        <div class="form-group">
          <label for="telefon">Număr de telefon</label>
          <input type="tel" id="telefon" placeholder="07xx xxx xxx" required />
        </div>
        <button type="submit" class="btn btn-gold btn-full">Găsește contul meu</button>
      </form>
    </div>

    <!-- PASUL 2: Afișare parolă -->
    <div id="step-2" style="display:none; text-align:center;">
      <div class="alert alert-success show" id="alert-success">
        ✅ Cont găsit! Parola ta este:
      </div>
      <div class="password-box">
        <div class="label">Parola contului tău BarberElite</div>
        <div class="password-value" id="parola-afisata"></div>
      </div>
      <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">
        ⚠ Notează parola și păstreaz-o în siguranță.
      </p>
      <a href="login.html" class="btn btn-gold btn-full">Mergi la conectare</a>
    </div>

    <div class="form-footer">
      <a href="login.html">← Înapoi la conectare</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  document.getElementById('recover-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email   = document.getElementById('email').value.trim();
    const telefon = document.getElementById('telefon').value.trim();

    const errEl = document.getElementById('alert-error');
    errEl.classList.remove('show');

    const result = recoverPassword(email, telefon);
    if (!result.success) {
      errEl.textContent = result.message;
      errEl.classList.add('show');
    } else {
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('parola-afisata').textContent = result.parola;
      document.getElementById('step-2').style.display = 'block';
    }
  });
</script>
</body>
</html>
