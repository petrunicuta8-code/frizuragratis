<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<p id="status">Generez iconițele...</p>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  
  // Fundal roșu
  ctx.fillStyle = '#d32f2f';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  
  // Cerc interior
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.arc(s/2, s/2, s*0.38, 0, Math.PI*2);
  ctx.fill();
  
  // Text ✂
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${s*0.35}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✂', s/2, s/2 - s*0.05);
  
  // Text N
  ctx.font = `bold ${s*0.18}px Arial`;
  ctx.fillText('NADO', s/2, s/2 + s*0.28);
}

const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');
drawIcon(c192);
drawIcon(c512);

// Download automat
function download(canvas, name) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = name;
  a.click();
}

setTimeout(() => {
  download(c192, 'icon-192.png');
  setTimeout(() => {
    download(c512, 'icon-512.png');
    document.getElementById('status').innerHTML = 
      '✅ Iconițele au fost descărcate!<br><br>' +
      'Mută fișierele <strong>icon-192.png</strong> și <strong>icon-512.png</strong> ' +
      'în folderul <strong>icons/</strong> din site frizarie.<br><br>' +
      'Apoi șterge acest fișier generate-icons.html';
  }, 500);
}, 500);
</script>
</body>
</html>
